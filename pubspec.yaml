name: she_wo
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ">=2.17.6 <3.0.0"

dependencies:
  connectivity_plus: ^2.2.0
  flutter:
    sdk: flutter
  flutter_progress_hud: ^2.0.0
  flutter_rating_bar: ^4.0.1
  flutter_svg: ^0.23.0+1
  fluttertoast: ^8.0.8
  font_awesome_flutter: ^9.1.0
  geocoding: null
  geolocator: null
  http: ^0.13.3
  intl: ^0.18.0
  line_icons: ^2.0.1
  mask_text_input_formatter: ^2.0.0
  page_transition: ^2.0.9
  provider: ^6.0.0
  shared_preferences: ^2.0.6
  table_calendar: ^3.0.9
  webview_flutter: ^2.0.12

dev_dependencies:
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/images/

  fonts:
    - family: futura_medium_bt
      fonts:
        - asset: assets/fonts/futura_medium_bt.ttf

    - family: nouvelle_vague_final
      fonts:
        - asset: assets/fonts/nouvelle_vague_final.ttf

    - family: gothic_book
      fonts:
        - asset: assets/fonts/gothic_book.ttf

    - family: futura_light_bt
      fonts:
        - asset: assets/fonts/futura_light_bt.ttf
